# .codex/config.toml
#
# 이 파일은 프로젝트 로컬 Codex 설정이다.
# 사용자 계정, 인증, 개인 환경 설정은 ~/.codex/config.toml에 둔다.
#
# Stage 4에서는 GPT-5.5/o3 모델을 GPT-5.6 Terra로 호환성 마이그레이션한다.
# 역할별 Sol/Terra/Luna 최적화는 Stage 5에서 수행한다.

model = "gpt-5.6-terra"
model_reasoning_effort = "high"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
allow_login_shell = false

[features]
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 5
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"
interrupt_message = true

# Codex 공식 config에는 max_depth 키가 없다.
# subagent 재귀 금지는 .agents/skills/execute-task/SKILL.md의 하네스 정책으로 통제한다.
#
# Codex 공식 config에는 job_max_runtime_seconds 키가 없다.
# 명령 단위 timeout이 필요하면 TASK verification command 또는 해당 도구의 timeout으로 명시한다.

[sandbox_workspace_write]
network_access = false

[agents.orchestrator]
config_file = "agents/orchestrator.toml"
description = "하나의 TASK 파일을 기준으로 구현, 검증, 리뷰, 기록, 최종 커밋을 조율한다."

[agents.implementer]
config_file = "agents/implementer.toml"
description = "TASK 허용 범위 안에서 최소 구현을 수행한다."

[agents.verifier]
config_file = "agents/verifier.toml"
description = "테스트, 린트, 빌드, acceptance criteria를 검증한다."

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "diff를 검토하고 정확성, 위험, 범위 준수를 확인한다."

[agents.recorder]
config_file = "agents/recorder.toml"
description = "TASK 실행 로그, 검증 증거, 리뷰 결과, 상태 기록을 작성한다."

[agents.evaluator]
config_file = "agents/evaluator.toml"
description = "기능 단위 평가표 기반 품질 평가와 사용자 검증 안내를 수행한다."
